quarkus.http.port=8080
quarkus.analytics.disabled=true

# Mock KYC (grupo 5 por defecto). Cambiar con ONBOARDING_MOCK_BASE_URL.
onboarding.mock.base-url=${ONBOARDING_MOCK_BASE_URL:https://bcp-wallet-mock.yefri.workers.dev/groups/5}
quarkus.rest-client.kyc-mock.url=${onboarding.mock.base-url}
quarkus.rest-client.kyc-mock.connect-timeout=5000
quarkus.rest-client.kyc-mock.read-timeout=10000

# Modo demo: selector de escenario, decision manual, resumen y eventos.
onboarding.demo.enabled=${ONBOARDING_DEMO_ENABLED:false}
%dev.onboarding.demo.enabled=${ONBOARDING_DEMO_ENABLED:true}
%test.onboarding.demo.enabled=true
%test.quarkus.http.test-port=0

# Persistencia H2 en archivo; borrar ./data con el backend detenido para reiniciar los datos.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/onboarding
quarkus.hibernate-orm.schema-management.strategy=update

%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:onboarding-test;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
